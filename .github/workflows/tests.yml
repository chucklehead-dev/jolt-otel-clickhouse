name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JOLT_CACHE_DIR: ${{ github.workspace }}/.jolt-cache-v0.8.6
      JOLT_GITLIBS_DIR: ${{ github.workspace }}/.jolt-gitlibs-v0.8.6
      HEGEL_CACHE_DIR: ${{ github.workspace }}/.hegel-native
      JOLT_CHDB_CACHE_DIR: ${{ github.workspace }}/.chdb-native
    steps:
      - uses: actions/checkout@v4
      - name: Offline runtime artifact trust controls
        timeout-minutes: 2
        run: timeout 30s python3 scripts/test-qualified-durable-runtime.py
      - name: Synthetic benchmark failure receipt controls
        timeout-minutes: 2
        # Fake compiler only: no performance run, native storage or credentials.
        run: timeout 60s python3 scripts/test-ordinary-transport-failure-receipts.py
      - name: Install Jolt v0.8.6
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/jolt-bin"
          curl -fsSL https://raw.githubusercontent.com/jolt-lang/jolt/v0.8.6/install \
            | bash -s -- --dir "$install_dir" --version 0.8.6
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Assert Jolt version
        shell: bash
        run: test "$(jolt --version)" = "jolt v0.8.6"
      - name: Reject ignored reviewed-source provider files
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/qualify-durable-typed-native.sh --self-test-cleanliness \
            | tee "$RUNNER_TEMP/exporter-reviewed-source-cleanliness.log"
          test "$(grep -Fxc 'reviewed-source-cleanliness-controls-qualified' "$RUNNER_TEMP/exporter-reviewed-source-cleanliness.log")" = 1
      - name: Install native test dependencies
        run: |
          set -euo pipefail
          jolt -Srepro -m jdbc.chdb.install
          jolt -Srepro -A:test -m hegel.install
      - name: Fake child executable provenance controls
        timeout-minutes: 2
        shell: bash
        # Parent loads native-related namespaces; child stubs invoke no Jolt.
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 60s jolt -Srepro -A:test -e \
            "(require 'otel.exporter.chdb-child-provenance-test 'clojure.test) (let [r (clojure.test/run-tests 'otel.exporter.chdb-child-provenance-test) ok (and (= 1 (:test r)) (= 10 (:pass r)) (zero? (:fail r)) (zero? (:error r)))] (println :fake-child-provenance-result :qualified ok) (System/exit (if ok 0 1)))"
      - name: Test
        run: jolt -Srepro -M:test
      - name: Read the exact root driver pin
        id: driver
        shell: bash
        run: |
          set -euo pipefail
          revision=$(jolt -Srepro -e "(require 'clojure.edn) (println (get-in (clojure.edn/read-string (slurp \"deps.edn\")) [:deps 'io.github.chucklehead-dev/jolt-chdb :git/sha]))")
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
      - name: Check out that driver revision, not a branch tip
        uses: actions/checkout@v4
        with:
          repository: chucklehead-dev/jolt-chdb
          ref: ${{ steps.driver.outputs.revision }}
          path: .qualification-driver
          persist-credentials: false
      - name: Require the root API and authenticate the native pair
        timeout-minutes: 5
        shell: bash
        env:
          EXPECTED_DRIVER_REVISION: ${{ steps.driver.outputs.revision }}
        run: |
          set -euo pipefail
          driver=$(realpath .qualification-driver)
          test "$(git -C "$driver" rev-parse HEAD)" = "$EXPECTED_DRIVER_REVISION"
          test -z "$(git -C "$driver" status --porcelain=v1)"
          # No dependency override: old root pins must fail, never skip this lane.
          timeout --signal=TERM --kill-after=5s 30s jolt -Srepro -e \
            "(require 'jdbc.chdb) (when-not (fn? (some-> (ns-resolve 'jdbc.chdb 'insert-json-rows!) deref)) (println :required-root-row-api-missing) (System/exit 1))"
          metadata=$(jolt -Srepro -e "(require 'jdbc.chdb.native) (let [{:keys [os arch]} (jdbc.chdb.native/platform) asset (get jdbc.chdb.native/assets [os arch])] (assert (= \"26.7.3\" jdbc.chdb.native/version)) (println (:name asset)) (println (:sha256 asset)) (println (jdbc.chdb.native/library-path)))")
          mapfile -t values <<< "$metadata"
          test "${#values[@]}" = 3
          [[ "${values[0]}" =~ ^[a-zA-Z0-9_.-]+$ && "${values[1]}" =~ ^[a-f0-9]{64}$ ]]
          pair=$(mktemp -d "$RUNNER_TEMP/exporter-native-pair.XXXXXXXX")
          curl --fail --location --retry 2 --silent --show-error \
            "https://github.com/chdb-io/chdb-core/releases/download/v26.7.3/${values[0]}" -o "$pair/archive.tar.gz"
          printf '%s  %s\n' "${values[1]}" "$pair/archive.tar.gz" | sha256sum -c -
          tar -xzf "$pair/archive.tar.gz" -C "$pair"
          lib=$(realpath "$pair/libchdb.so")
          header=$(realpath "$pair/chdb.h")
          test -f "$lib" && test -f "$header"
          cmp "${values[2]}" "$lib"
          binary=$(realpath "$(command -v jolt)")
          # Hosted release is self-contained; env launches it without a source
          # build or external Chez selection. Local gates still require 10.4.1.
          wrapper=$(realpath /usr/bin/env)
          {
            printf 'JOLT_BIN=%s\nJOLT_WRAPPER=%s\n' "$binary" "$wrapper"
            printf 'JOLT_EXPECTED_BINARY_SHA256=%s\n' "$(sha256sum "$binary" | cut -d ' ' -f1)"
            printf 'JOLT_EXPECTED_WRAPPER_SHA256=%s\n' "$(sha256sum "$wrapper" | cut -d ' ' -f1)"
            printf 'JOLT_CHDB_LIB=%s\nJOLT_CHDB_HEADER=%s\n' "$lib" "$header"
            printf 'JOLT_CHDB_EXPECTED_LIBRARY_SHA256=%s\n' "$(sha256sum "$lib" | cut -d ' ' -f1)"
            printf 'JOLT_CHDB_EXPECTED_HEADER_SHA256=%s\n' "$(sha256sum "$header" | cut -d ' ' -f1)"
            printf 'JOLT_CHDB_SOURCE_ROOT=%s\n' "$driver"
          } >> "$GITHUB_ENV"
          sha256sum "$binary" "$wrapper" "$lib" "$header"
      - name: Qualify ordinary native typed rows and metric admission
        id: ordinary_native
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 90s "$JOLT_BIN" -Srepro -A:test -e \
            "(require 'otel.exporter.chdb-ordinary-rows-native-test) (let [n (atom 0)] (otel.exporter.chdb-ordinary-rows-native-test/run-native! (fn [_ expected actual] (swap! n inc) (when-not (= expected actual) (throw (ex-info \"ordinary native check failed\" {}))))) (assert (= 55 @n)) (println \"PASS ordinary native 55\"))" | tee "$RUNNER_TEMP/exporter-ordinary-native.log"
          test "$(grep -Fxc 'PASS ordinary native 55' "$RUNNER_TEMP/exporter-ordinary-native.log")" = 1
      - name: Qualify direct native typed metric projection
        id: typed_metric_native
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 90s "$JOLT_BIN" -Srepro -A:test \
            -m otel.exporter.chdb-typed-metric-native-test \
            | tee "$RUNNER_TEMP/exporter-typed-metric-native.log"
          test "$(grep -Fxc 'typed-metric-native-qualified :observed-checks 17' "$RUNNER_TEMP/exporter-typed-metric-native.log")" = 1
      - name: Qualify typed metric OTLP socket loopback
        id: typed_metric_socket
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 90s "$JOLT_BIN" -Srepro -A:typed-gauge-socket-test -M \
            | tee "$RUNNER_TEMP/exporter-typed-metric-socket-native.log"
          test "$(grep -Fxc 'typed-metric-socket-qualified :observed-checks 15' "$RUNNER_TEMP/exporter-typed-metric-socket-native.log")" = 1
      - name: Qualify typed histogram OTLP socket loopback
        id: typed_histogram_socket
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 90s "$JOLT_BIN" -Srepro -A:typed-histogram-socket-test -M \
            | tee "$RUNNER_TEMP/exporter-typed-histogram-socket-native.log"
          test "$(grep -Fxc 'typed-histogram-native-qualified :observed-checks 8' "$RUNNER_TEMP/exporter-typed-histogram-socket-native.log")" = 1
      - name: Official host rejects unsupported Durable before effects
        timeout-minutes: 2
        shell: bash
        env:
          EXPECTED_DRIVER_REVISION: ${{ steps.driver.outputs.revision }}
        run: |
          set -euo pipefail
          test "$(git -C .qualification-driver rev-parse HEAD)" = "$EXPECTED_DRIVER_REVISION"
          # The root driver guards both public opens before storage or native
          # effects. Do not depend on a driver test helper that may be renamed.
          timeout --signal=TERM --kill-after=5s 90s "$JOLT_BIN" -Srepro -e '
              (require (quote jdbc.chdb.durable))
              (let [capable? (ns-resolve (quote jdbc.chdb.durable)
                                         (quote strict-utf8-decoder-capable?))
                    calls (atom 0)
                    options {:operations {:durable-capability
                                           (fn [] (swap! calls inc) {:status :supported})}}
                    expected :jdbc.chdb.durable/strict-utf8-decoder-unavailable]
                (assert (and capable? (fn? (deref capable?))))
                (assert (false? ((deref capable?))))
                (doseq [open! [jdbc.chdb.durable/open-reader!
                               jdbc.chdb.durable/open-writer!]]
                  (let [actual (try (open! options)
                                    nil
                                    (catch Throwable error
                                      (:type (ex-data error))))]
                    (assert (= expected actual))))
                (assert (zero? @calls))
                (println "PASS official unsupported capability boundary 2"))' \
            | tee "$RUNNER_TEMP/exporter-official-capability-negative.log"
          test "$(grep -Fxc 'PASS official unsupported capability boundary 2' "$RUNNER_TEMP/exporter-official-capability-negative.log")" = 1

      # The root chDB pin deliberately rejects the released runtime here: its
      # Durable writer needs the fixed strict decoder and ranged writer append.
      # Keep the ordinary lane on released Jolt; bind this one to the exact
      # compiler revision qualified by that same immutable root dependency.
      - name: Install the root-qualified Durable Jolt compiler
        id: durable_jolt
        uses: chucklehead-dev/jolt-chdb/.github/actions/install-jolt-aspects@19e0ecf9e9f5e2c3f24ac8758f5d6953fd021774
      - name: Bind the selected compiler executable to the Durable fixture
        shell: bash
        env:
          DURABLE_JOLT_SOURCE_SHA: ${{ steps.durable_jolt.outputs.source-sha }}
          DURABLE_JOLT_VERSION: ${{ steps.durable_jolt.outputs.version }}
        run: |
          set -euo pipefail
          test "$DURABLE_JOLT_SOURCE_SHA" = "120643d6bc322800a700e870de5c8087ad6085fa"
          test "$DURABLE_JOLT_VERSION" = "jolt v0.8.6-97-g120643d6"
          binary=$(realpath "$(command -v jolt)")
          test "$("$binary" --version)" = "$DURABLE_JOLT_VERSION"
          printf 'JOLT_BIN=%s\n' "$binary" >> "$GITHUB_ENV"
          # This records the executable selected above and the qualification
          # script rechecks it before launch, preventing a later path swap. It
          # is deliberately not presented as a published-binary provenance
          # digest: this workflow has no immutable release artifact for this
          # untagged compiler revision.
          printf 'JOLT_EXPECTED_BINARY_SHA256=%s\n' "$(sha256sum "$binary" | cut -d ' ' -f1)" >> "$GITHUB_ENV"
          printf 'JOLT_DURABLE_COMPILER_SOURCE_SHA=%s\n' "$DURABLE_JOLT_SOURCE_SHA" >> "$GITHUB_ENV"

      - name: Qualify untyped Durable encoder with a fresh reader
        id: untyped_encoder_native
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          TMPDIR=/tmp timeout --signal=TERM --kill-after=5s 210s "$JOLT_BIN" -Srepro -A:test -e \
            "(require 'otel.exporter.chdb-untyped-encoder-native-test) (#'otel.exporter.chdb-untyped-encoder-native-test/run \"$JOLT_BIN\")" \
            | tee "$RUNNER_TEMP/exporter-untyped-encoder-native.log"
          root=$(sed -n 's/^:untyped-encoder-native-two-process-green //p' "$RUNNER_TEMP/exporter-untyped-encoder-native.log")
          [[ "$root" =~ ^/tmp/untyped-encoder-native-[0-9]+-1\.gate$ ]]

      - name: Qualify typed Durable WAL with a fresh reader
        id: durable_native
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          TMPDIR=/tmp timeout --signal=TERM --kill-after=5s 210s bash scripts/qualify-durable-typed-native.sh \
            | tee "$RUNNER_TEMP/exporter-durable-native.log"
          test "$(grep -Fxc 'durable-typed-native-qualified' "$RUNNER_TEMP/exporter-durable-native.log")" = 1
          test "$(grep -c '^EVIDENCE_ROOT=' "$RUNNER_TEMP/exporter-durable-native.log")" = 1
          root=$(sed -n 's/^EVIDENCE_ROOT=//p' "$RUNNER_TEMP/exporter-durable-native.log")
          [[ "$root" =~ ^/tmp/exporter-durable-native\.[A-Za-z0-9]+$ ]]
          test -d "$root" && test ! -L "$root"
          test "$(realpath "$root")" = "$root"
          test "$(grep -Fxc ':observed-checks 25' "$root/writer.log")" = 1
          test "$(grep -Fxc ':observed-checks 24' "$root/reader.log")" = 1
      - name: Reopen typed Durable WAL after verified writer crash
        id: durable_crash_reopen
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          TMPDIR=/tmp timeout --signal=TERM --kill-after=5s 210s \
            bash scripts/qualify-durable-typed-native.sh --wal-crash-reopen \
            | tee "$RUNNER_TEMP/exporter-durable-crash-native.log"
          test "$(grep -Fxc 'durable-typed-wal-crash-replay-qualified' "$RUNNER_TEMP/exporter-durable-crash-native.log")" = 1
          test "$(grep -c '^EVIDENCE_ROOT=' "$RUNNER_TEMP/exporter-durable-crash-native.log")" = 1
          root=$(sed -n 's/^EVIDENCE_ROOT=//p' "$RUNNER_TEMP/exporter-durable-crash-native.log")
          [[ "$root" =~ ^/tmp/exporter-durable-native\.[A-Za-z0-9]+$ ]]
          test -d "$root" && test ! -L "$root"
          test "$(realpath "$root")" = "$root"
          test "$(cat "$root/crash-receipt.txt")" = 'verified-writer-sigkill status=137'
          test "$(grep -Fxc ':wal-ready' "$root/writer.log")" = 1
          test "$(grep -Fxc ':reader-verified' "$root/reader.log")" = 1
          test "$(grep -Fxc ':observed-checks 24' "$root/reader.log")" = 1
      - name: Retain only synthetic native fixture logs and status
        if: always()
        shell: bash
        env:
          ORDINARY_OUTCOME: ${{ steps.ordinary_native.outcome }}
          TYPED_METRIC_OUTCOME: ${{ steps.typed_metric_native.outcome }}
          TYPED_METRIC_SOCKET_OUTCOME: ${{ steps.typed_metric_socket.outcome }}
          TYPED_HISTOGRAM_SOCKET_OUTCOME: ${{ steps.typed_histogram_socket.outcome }}
          UNTYPED_ENCODER_OUTCOME: ${{ steps.untyped_encoder_native.outcome }}
          DURABLE_OUTCOME: ${{ steps.durable_native.outcome }}
          DURABLE_CRASH_OUTCOME: ${{ steps.durable_crash_reopen.outcome }}
          DRIVER_REVISION: ${{ steps.driver.outputs.revision }}
          DURABLE_COMPILER_REVISION: ${{ steps.durable_jolt.outputs.source-sha }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/exporter-native-evidence"
          mkdir -p "$evidence"
          printf 'ordinary-step=%s\ntyped-metric-step=%s\ntyped-metric-socket-step=%s\ntyped-histogram-socket-step=%s\nuntyped-encoder-step=%s\ndurable-step=%s\ndurable-crash-step=%s\nroot-driver=%s\ndurable-jolt=%s\n' \
            "$ORDINARY_OUTCOME" "$TYPED_METRIC_OUTCOME" "$TYPED_METRIC_SOCKET_OUTCOME" "$TYPED_HISTOGRAM_SOCKET_OUTCOME" "$UNTYPED_ENCODER_OUTCOME" "$DURABLE_OUTCOME" "$DURABLE_CRASH_OUTCOME" "$DRIVER_REVISION" "$DURABLE_COMPILER_REVISION" > "$evidence/status.txt"
          # Only public authentication diagnostics/boundary fixture output.
          for kind in official-capability-negative; do
            log="$RUNNER_TEMP/exporter-$kind.log"
            if [[ -f "$log" && ! -L "$log" ]]; then
              cp "$log" "$evidence/$kind.log"
              sha256sum "$evidence/$kind.log" >> "$evidence/status.txt"
            fi
          done
          # Never traverse or upload native stores, WAL, databases or env files.
          for kind in ordinary typed-metric typed-metric-socket typed-histogram-socket untyped-encoder durable durable-crash; do
            log="$RUNNER_TEMP/exporter-$kind-native.log"
            if [[ -f "$log" && ! -L "$log" ]]; then
              cp "$log" "$evidence/$kind.log"
              printf '%s-log=present\n' "$kind" >> "$evidence/status.txt"
              sha256sum "$evidence/$kind.log" >> "$evidence/status.txt"
            else printf '%s-log=missing\n' "$kind" >> "$evidence/status.txt"; fi
          done
          if [[ "$TYPED_METRIC_SOCKET_OUTCOME" == success ]]; then
            test -f "$RUNNER_TEMP/exporter-typed-metric-socket-native.log"
            test ! -L "$RUNNER_TEMP/exporter-typed-metric-socket-native.log"
            test "$(grep -Fxc 'typed-metric-socket-qualified :observed-checks 15' "$RUNNER_TEMP/exporter-typed-metric-socket-native.log")" = 1
            test "$(grep -Fxc 'typed-metric-socket-log=present' "$evidence/status.txt")" = 1
          fi
          if [[ "$TYPED_HISTOGRAM_SOCKET_OUTCOME" == success ]]; then
            test -f "$RUNNER_TEMP/exporter-typed-histogram-socket-native.log"
            test ! -L "$RUNNER_TEMP/exporter-typed-histogram-socket-native.log"
            test "$(grep -Fxc 'typed-histogram-native-qualified :observed-checks 8' "$RUNNER_TEMP/exporter-typed-histogram-socket-native.log")" = 1
            test "$(grep -Fxc 'typed-histogram-socket-log=present' "$evidence/status.txt")" = 1
          fi
          log="$RUNNER_TEMP/exporter-durable-native.log"
          if [[ -f "$log" && ! -L "$log" && "$(grep -c '^EVIDENCE_ROOT=' "$log" || true)" == 1 ]]; then
            root=$(sed -n 's/^EVIDENCE_ROOT=//p' "$log")
            if [[ "$root" =~ ^/tmp/exporter-durable-native\.[A-Za-z0-9]+$ &&
                  -d "$root" && ! -L "$root" && "$(realpath "$root")" == "$root" ]]; then
              for child in writer reader; do
                log="$root/$child.log"
                if [[ -f "$log" && ! -L "$log" && "$(realpath "$log")" == "$root/$child.log" ]]; then
                  cp "$log" "$evidence/$child.log"
                  sha256sum "$evidence/$child.log" >> "$evidence/status.txt"
                else printf '%s-log=missing-or-unconfirmed\n' "$child" >> "$evidence/status.txt"; fi
              done
            else printf 'durable-root=unconfirmed\n' >> "$evidence/status.txt"; fi
          else printf 'durable-root=missing-or-ambiguous\n' >> "$evidence/status.txt"; fi
          log="$RUNNER_TEMP/exporter-durable-crash-native.log"
          if [[ -f "$log" && ! -L "$log" && "$(grep -c '^EVIDENCE_ROOT=' "$log" || true)" == 1 ]]; then
            root=$(sed -n 's/^EVIDENCE_ROOT=//p' "$log")
            if [[ "$root" =~ ^/tmp/exporter-durable-native\.[A-Za-z0-9]+$ &&
                  -d "$root" && ! -L "$root" && "$(realpath "$root")" == "$root" ]]; then
              for child in writer reader; do
                log="$root/$child.log"
                if [[ -f "$log" && ! -L "$log" && "$(realpath "$log")" == "$root/$child.log" ]]; then
                  cp "$log" "$evidence/crash-$child.log"
                  sha256sum "$evidence/crash-$child.log" >> "$evidence/status.txt"
                else printf 'crash-%s-log=missing-or-unconfirmed\n' "$child" >> "$evidence/status.txt"; fi
              done
            else printf 'durable-crash-root=unconfirmed\n' >> "$evidence/status.txt"; fi
          else printf 'durable-crash-root=missing-or-ambiguous\n' >> "$evidence/status.txt"; fi
      - name: Upload the explicit synthetic-log allowlist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exporter-native-fixture-logs
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/exporter-native-evidence/status.txt
            ${{ runner.temp }}/exporter-native-evidence/ordinary.log
            ${{ runner.temp }}/exporter-native-evidence/typed-metric.log
            ${{ runner.temp }}/exporter-native-evidence/typed-metric-socket.log
            ${{ runner.temp }}/exporter-native-evidence/untyped-encoder.log
            ${{ runner.temp }}/exporter-native-evidence/durable.log
            ${{ runner.temp }}/exporter-native-evidence/durable-crash.log
            ${{ runner.temp }}/exporter-native-evidence/writer.log
            ${{ runner.temp }}/exporter-native-evidence/reader.log
            ${{ runner.temp }}/exporter-native-evidence/crash-writer.log
            ${{ runner.temp }}/exporter-native-evidence/crash-reader.log
            ${{ runner.temp }}/exporter-native-evidence/official-capability-negative.log
